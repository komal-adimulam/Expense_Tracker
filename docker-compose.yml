services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wall
      POSTGRES_PASSWORD: wall
      POSTGRES_DB: wall
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wall"]
      interval: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://wall:wall@db:5432/wall
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
